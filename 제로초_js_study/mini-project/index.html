<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/style.css" />
    <title>회의록 캘린더</title>
  </head>
  <body>
    <section id="wrapper">
      <header>
        <h2 class="title">📆Meetendar</h2>
      </header>

      <main id="main">
        <section id="calendar">
          <div class="calendar-header">
            <button onclick="prevMonth()" id="prev-month">&lt;</button>
            <div>
              <span id="year"></span>
              <span id="month"></span>
            </div>
            <button onclick="nextMonth()" id="next-month">&gt;</button>
          </div>

          <div class="calendar-main">
            <div class="date-title">
              <div style="color: red">일</div>
              <div>월</div>
              <div>화</div>
              <div>수</div>
              <div>목</div>
              <div>금</div>
              <div style="color: blue">토</div>
            </div>

            <div class="date-board"></div>
          </div>
        </section>

        <!-- 게시판 영역  -->
        <section id="memo-board">
          <div class="board-title">
            <ul></ul>
          </div>
          <div class="board-list" data-date=""></div>
          <div onclick="plusBtn()" class="plusBtn">
            <img src="/img/plusBtn.svg" alt="플러스 버튼" />
          </div>
        </section>

        <div id="modal-overlay" class="modal-overlay"></div>

        <!-- 처음 회의록 모달창 -->
        <section id="baseMemo-modal">
          <div>
            <div onclick="hideBtn()" class="closeBtn">
              <div>X</div>
            </div>
            <ul class="modal-contain">
              <li class="meeting-date"></li>
              <li class="meeting-topic">
                <div>회의 주제</div>
                <input id="topic" type="text" />
              </li>
              <li class="meeting-participants">
                <div>참여자</div>
                <input id="attendees" type="text" />
              </li>
              <li class="meeting-content">
                <div>회의 내용</div>
                <textarea id="content"></textarea>
              </li>
            </ul>
            <div class="btn-contain">
              <button type="submit" onclick="saveBtn()" class="saveBtn">
                저장
              </button>
            </div>
          </div>
        </section>

        <!-- 수정 및 삭제 회의록 모달창 -->
        <section id="memo-view-modal">
          <div>
            <div onclick="hideBtn()" class="closeBtn">
              <div>X</div>
            </div>
            <ul class="modal-contain">
              <li class="meeting-date"></li>
              <li class="meeting-topic">
                <div>회의 주제</div>
                <input id="view-topic" type="text" readonly />
              </li>
              <li class="meeting-participants">
                <div>참여자</div>
                <input id="view-attendees" type="text" readonly />
              </li>
              <li class="meeting-content">
                <div>회의 내용</div>
                <textarea id="view-content" readonly></textarea>
              </li>
            </ul>
            <div class="btn-contain">
              <button onclick="changeBtn()" class="changeBtn">수정</button>
              <button onclick="delBtn()" class="delBtn">삭제</button>
            </div>
          </div>
        </section>

        <section id="memo-editor-modal">
          <div>
            <div onclick="hideBtn()" class="closeBtn">
              <div>X</div>
            </div>
            <ul class="modal-contain">
              <li class="meeting-date"></li>
              <li class="meeting-topic">
                <div>회의 주제</div>
                <input id="edit-topic" type="text" />
              </li>
              <li class="meeting-participants">
                <div>참여자</div>
                <input id="edit-attendees" type="text" />
              </li>
              <li class="meeting-content">
                <div>회의 내용</div>
                <textarea id="edit-content"></textarea>
              </li>
            </ul>
            <div class="btn-contain">
              <button onclick="updateBtn()" class="updateBtn">저장</button>
            </div>
          </div>
        </section>
      </main>
    </section>
    <script>
      function loadMemo() {
        return JSON.parse(localStorage.getItem("memos")) || {};
      }

      // 전역으로 memos라는 키를 찾아 불러옴
      let memoData = JSON.parse(localStorage.getItem("memos")) || {};
    </script>
    <script src="/script/board.js" defer></script>
    <script src="/script/calendar.js" defer></script>
    <script src="/script/memo-editor.js" defer></script>
  </body>
</html>
